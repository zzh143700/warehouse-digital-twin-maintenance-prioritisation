<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1680" viewBox="0 0 1200 1680" role="img" aria-labelledby="title desc">
  <title id="title">PRISMA-informed literature selection flow</title>
  <desc id="desc">Flow chart showing identification, screening, eligibility and inclusion counts for the dissertation literature review.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #243B53; }
      .subtitle { font: 14px Arial, sans-serif; fill: #64748B; }
      .stage { fill: #F1F5F9; stroke: #CBD5E1; stroke-width: 1.5; }
      .stageText { font: 700 15px Arial, sans-serif; fill: #334155; }
      .main { fill: #E8F5E9; stroke: #2E7D32; stroke-width: 2; }
      .retrieval { fill: #FFF3E0; stroke: #EF6C00; stroke-width: 2; }
      .removal { fill: #FFF8E1; stroke: #F9A825; stroke-width: 2; }
      .final { fill: #E3F2FD; stroke: #1565C0; stroke-width: 2; }
      .strata { fill: #F3E5F5; stroke: #7B1FA2; stroke-width: 2; }
      .boxTitle { font: 700 16px Arial, sans-serif; fill: #243B53; }
      .boxText { font: 14px Arial, sans-serif; fill: #243B53; }
      .boxSmall { font: 12px Arial, sans-serif; fill: #475569; }
      .note { font: 12px Arial, sans-serif; fill: #64748B; }
      .arrow { stroke: #6b7280; stroke-width: 2.3; fill: none; marker-end: url(#arrow); }
      .dashArrow { stroke: #6b7280; stroke-width: 2; fill: none; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="1680" fill="#FFFFFF"/>

  <text x="600" y="45" text-anchor="middle" class="title">PRISMA-Informed Literature Selection Flow</text>
  <text x="600" y="72" text-anchor="middle" class="subtitle">RQ: Can AI-predicted RUL generate risk-based maintenance priority rankings in a conceptual warehouse digital twin?</text>

  <!-- Identification -->
  <rect x="70" y="115" width="150" height="42" rx="10" class="stage"/>
  <text x="145" y="141" text-anchor="middle" class="stageText">Identification</text>

  <rect x="300" y="105" width="560" height="138" rx="6" class="main"/>
  <text x="580" y="132" text-anchor="middle" class="boxTitle">Records identified from databases/platforms</text>
  <text x="580" y="157" text-anchor="middle" class="boxText">displayed hits: n = 6,416</text>
  <text x="580" y="186" text-anchor="middle" class="boxText">Scopus, Web of Science, IEEE Xplore, Google Scholar,</text>
  <text x="580" y="207" text-anchor="middle" class="boxText">ScienceDirect and Warwick Library Search</text>
  <text x="580" y="230" text-anchor="middle" class="boxSmall">Displayed hit counts include database overlap</text>

  <line x1="580" y1="243" x2="580" y2="288" class="arrow"/>

  <rect x="300" y="288" width="560" height="105" rx="6" class="main"/>
  <text x="580" y="318" text-anchor="middle" class="boxTitle">Records captured for pilot screening</text>
  <text x="580" y="344" text-anchor="middle" class="boxText">n = 100</text>
  <text x="580" y="371" text-anchor="middle" class="boxSmall">Records exported/captured into screening CSV</text>

  <rect x="920" y="293" width="220" height="95" rx="6" class="removal"/>
  <text x="1030" y="322" text-anchor="middle" class="boxTitle">Duplicates removed</text>
  <text x="1030" y="348" text-anchor="middle" class="boxText">n = 15</text>
  <text x="1030" y="373" text-anchor="middle" class="boxSmall">Normalised-title deduplication</text>
  <line x1="860" y1="340" x2="918" y2="340" class="dashArrow"/>

  <line x1="580" y1="393" x2="580" y2="448" class="arrow"/>

  <!-- Screening -->
  <rect x="70" y="458" width="150" height="42" rx="10" class="stage"/>
  <text x="145" y="484" text-anchor="middle" class="stageText">Screening</text>

  <rect x="300" y="448" width="560" height="92" rx="6" class="main"/>
  <text x="580" y="481" text-anchor="middle" class="boxTitle">Records screened by title and abstract</text>
  <text x="580" y="510" text-anchor="middle" class="boxText">n = 85</text>

  <rect x="920" y="434" width="220" height="120" rx="6" class="removal"/>
  <text x="1030" y="463" text-anchor="middle" class="boxTitle">Records excluded</text>
  <text x="1030" y="489" text-anchor="middle" class="boxText">n = 21</text>
  <text x="1030" y="514" text-anchor="middle" class="boxSmall">Weak RQ fit or insufficient</text>
  <text x="1030" y="532" text-anchor="middle" class="boxSmall">AI/RUL, DT or decision relevance</text>
  <line x1="860" y1="494" x2="918" y2="494" class="dashArrow"/>

  <line x1="580" y1="540" x2="580" y2="605" class="arrow"/>

  <!-- Eligibility -->
  <rect x="70" y="622" width="150" height="42" rx="10" class="stage"/>
  <text x="145" y="648" text-anchor="middle" class="stageText">Eligibility</text>

  <rect x="300" y="605" width="560" height="88" rx="6" class="retrieval"/>
  <text x="580" y="638" text-anchor="middle" class="boxTitle">Reports sought for full-text retrieval</text>
  <text x="580" y="666" text-anchor="middle" class="boxText">n = 64</text>

  <rect x="920" y="602" width="220" height="88" rx="6" class="removal"/>
  <text x="1030" y="636" text-anchor="middle" class="boxTitle">Reports not retrieved</text>
  <text x="1030" y="664" text-anchor="middle" class="boxText">n = 0</text>
  <line x1="860" y1="649" x2="918" y2="649" class="dashArrow"/>

  <line x1="580" y1="693" x2="580" y2="750" class="arrow"/>

  <rect x="300" y="750" width="560" height="112" rx="6" class="retrieval"/>
  <text x="580" y="783" text-anchor="middle" class="boxTitle">Full-text reports retrieved</text>
  <text x="580" y="811" text-anchor="middle" class="boxText">n = 64</text>
  <text x="580" y="838" text-anchor="middle" class="boxSmall">Manual retrieval through Warwick Library, publisher platforms</text>
  <text x="580" y="856" text-anchor="middle" class="boxSmall">or open-access routes</text>

  <line x1="580" y1="862" x2="580" y2="925" class="arrow"/>

  <rect x="300" y="925" width="560" height="88" rx="6" class="retrieval"/>
  <text x="580" y="958" text-anchor="middle" class="boxTitle">Full-text reports assessed for eligibility</text>
  <text x="580" y="986" text-anchor="middle" class="boxText">n = 64</text>

  <rect x="920" y="909" width="220" height="120" rx="6" class="removal"/>
  <text x="1030" y="936" text-anchor="middle" class="boxTitle">Reports excluded after</text>
  <text x="1030" y="956" text-anchor="middle" class="boxTitle">full-text screening</text>
  <text x="1030" y="982" text-anchor="middle" class="boxText">n = 0</text>
  <text x="1030" y="1006" text-anchor="middle" class="boxSmall">Retained literature was stratified</text>
  <line x1="860" y1="969" x2="918" y2="969" class="dashArrow"/>

  <line x1="580" y1="1013" x2="580" y2="1080" class="arrow"/>

  <!-- Included -->
  <rect x="70" y="1093" width="150" height="42" rx="10" class="stage"/>
  <text x="145" y="1119" text-anchor="middle" class="stageText">Included</text>

  <rect x="300" y="1080" width="560" height="92" rx="6" class="final"/>
  <text x="580" y="1113" text-anchor="middle" class="boxTitle">Studies retained for literature review synthesis</text>
  <text x="580" y="1142" text-anchor="middle" class="boxText">n = 64</text>

  <line x1="580" y1="1172" x2="580" y2="1228" class="arrow"/>

  <rect x="115" y="1228" width="280" height="125" rx="6" class="strata"/>
  <text x="255" y="1260" text-anchor="middle" class="boxTitle">Core evidence</text>
  <text x="255" y="1288" text-anchor="middle" class="boxText">n = 28</text>
  <text x="255" y="1315" text-anchor="middle" class="boxSmall">Detailed synthesis against</text>
  <text x="255" y="1333" text-anchor="middle" class="boxSmall">the refined RQ</text>

  <rect x="460" y="1228" width="280" height="125" rx="6" class="strata"/>
  <text x="600" y="1260" text-anchor="middle" class="boxTitle">Supporting method evidence</text>
  <text x="600" y="1288" text-anchor="middle" class="boxText">n = 20</text>
  <text x="600" y="1315" text-anchor="middle" class="boxSmall">AI/RUL, DT method, data</text>
  <text x="600" y="1333" text-anchor="middle" class="boxSmall">and architecture support</text>

  <rect x="805" y="1228" width="280" height="125" rx="6" class="strata"/>
  <text x="945" y="1260" text-anchor="middle" class="boxTitle">Background/review evidence</text>
  <text x="945" y="1288" text-anchor="middle" class="boxText">n = 16</text>
  <text x="945" y="1315" text-anchor="middle" class="boxSmall">Definitions, framing</text>
  <text x="945" y="1333" text-anchor="middle" class="boxSmall">and gap identification</text>

  <line x1="580" y1="1228" x2="255" y2="1228" class="arrow"/>
  <line x1="580" y1="1228" x2="600" y2="1228" class="arrow"/>
  <line x1="580" y1="1228" x2="945" y2="1228" class="arrow"/>

  <rect x="120" y="1430" width="960" height="108" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="145" y="1461" class="note" font-weight="700">Note.</text>
  <text x="183" y="1461" class="note">The 6,416 identification count is a displayed-hit count across search platforms and includes overlap.</text>
  <text x="145" y="1487" class="note">The structured screening set comprised 100 captured records. Following full-text retrieval, all 64 reports were assessed</text>
  <text x="145" y="1513" class="note">and retained, then stratified into core evidence, supporting method evidence and background/review evidence.</text>
</svg>
